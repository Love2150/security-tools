[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-unpacker"
version = "0.2.0"
description = "Safely reconstruct classic eval(function(...)) JavaScript packer payloads"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Brandon Love" }]
dependencies = []

[project.optional-dependencies]
beautify = ["jsbeautifier>=1.15.1"]

[project.urls]
Homepage = "https://github.com/Love2150/security-tools/tree/main/tools/eval-unpacker"
Repository = "https://github.com/Love2150/security-tools"
Issues = "https://github.com/Love2150/security-tools/issues"

[project.scripts]
eval-unpack = "eval_unpacker.cli:main"
