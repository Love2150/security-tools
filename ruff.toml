target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
# Parsing untrusted, partially malformed evidence intentionally degrades gracefully.
ignore = ["S110", "S112"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"tools/*/tests/**" = ["S101", "S603", "S607"]
# This compatibility wrapper adjusts sys.path before importing the package.
"tools/winlog-triage/wintriage.py" = ["E402"]
