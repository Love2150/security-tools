name: eval-unpacker CI

on:
  push:
    paths:
      - 'tools/eval-unpacker/**'
      - '.github/workflows/eval-unpacker-ci.yml'
  pull_request:
    paths:
      - 'tools/eval-unpacker/**'
      - '.github/workflows/eval-unpacker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and build tools
        working-directory: tools/eval-unpacker
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage build

      - name: Run tests with core coverage gate
        working-directory: tools/eval-unpacker
        run: |
          coverage run -m pytest -q
          coverage report --include='eval_unpacker/core.py' --fail-under=85

      - name: Build and install wheel
        working-directory: tools/eval-unpacker
        run: |
          python -m build --outdir dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Verify installed CLI outside the source tree
        working-directory: tools/eval-unpacker
        run: |
          python -c "import shutil, sys; sys.exit(0 if shutil.which('eval-unpack') else 1)"
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          printf "%s\n" "eval(function(p,a,c,k,e,d){return p}('abc',10,0,''.split('|')))" > sample.js
          test "$(eval-unpack sample.js)" = "abc"
          test "$(python -m eval_unpacker.cli sample.js)" = "abc"
